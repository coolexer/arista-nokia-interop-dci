! Interop option B: Arista leaf/VTEP. BLs stitch VXLAN to MPLS.
hostname dc1-leaf
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
vrf instance MGMT
vrf instance TENANT
ip routing
ip routing vrf TENANT
ip virtual-router mac-address 00:00:5e:00:01:01
!
interface Management1
   vrf MGMT
   ip address 172.31.248.11/24
ip route vrf MGMT 0.0.0.0/0 172.31.248.1
!
vlan 10
   name L2-STRETCH
vlan 20
   name DC1-L3-LOCAL
interface Ethernet1
   description IP uplink to dc1-bl
   no switchport
   mtu 9000
   ip address 100.64.1.0/31
   no shutdown
interface Ethernet2
   description h1 L2 - VLAN 10
   switchport mode access
   switchport access vlan 10
   spanning-tree portfast
   no shutdown
interface Ethernet3
   description h1 L3 - VLAN 20
   switchport mode access
   switchport access vlan 20
   spanning-tree portfast
   no shutdown
interface Loopback0
   ip address 10.255.1.1/32
interface Vlan20
   vrf TENANT
   mtu 1500
   ip address virtual 192.168.20.1/24
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vrf TENANT vni 50000
!
ip prefix-list UNDERLAY seq 10 permit 10.255.1.1/32
ip prefix-list UNDERLAY seq 20 permit 10.255.1.254/32
route-map UNDERLAY permit 10
   match ip address prefix-list UNDERLAY
!
router bgp 65101
   router-id 10.255.1.1
   no bgp default ipv4-unicast
   neighbor 100.64.1.1 remote-as 65000
   neighbor 100.64.1.1 description UNDERLAY-DC1-BL
   neighbor 100.64.1.1 route-map UNDERLAY in
   neighbor 100.64.1.1 route-map UNDERLAY out
   neighbor 10.255.1.254 remote-as 65000
   neighbor 10.255.1.254 ebgp-multihop 2
   neighbor 10.255.1.254 description LOCAL-EVPN-DC1-BL
   neighbor 10.255.1.254 update-source Loopback0
   neighbor 10.255.1.254 send-community extended
   address-family ipv4
      neighbor 100.64.1.1 activate
      no neighbor 10.255.1.254 activate
      network 10.255.1.1/32
   address-family evpn
      neighbor 10.255.1.254 activate
   vlan 10
      rd 10.255.1.1:10
      route-target both 65000:10010
      redistribute learned
   vrf TENANT
      rd 10.255.1.1:50000
      route-target import evpn 65000:50000
      route-target export evpn 65000:50000
      redistribute connected
!
end
