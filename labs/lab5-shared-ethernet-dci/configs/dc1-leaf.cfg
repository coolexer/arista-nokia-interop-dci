! Lab 5: local EVPN only; Arista leaf/VTEP, dual routed uplinks to transit-only Arista spines.
hostname dc1-leaf
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
vrf instance MGMT
vrf instance TENANT
ip routing
ip routing vrf TENANT
ip virtual-router mac-address 00:00:5e:00:01:01
!
interface Management0
   vrf MGMT
   ip address 172.31.251.11/24
ip route vrf MGMT 0.0.0.0/0 172.31.251.1
!
vlan 10
   name L2-STRETCH
vlan 20
   name DC1-L3-LOCAL
interface Ethernet1
   description IP uplink to dc1-spine1
   no switchport
   mtu 9000
   ip address 100.64.1.0/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
interface Ethernet2
   description h1 L2 - VLAN 10
   switchport mode access
   switchport access vlan 10
   spanning-tree portfast
   no shutdown
interface Ethernet3
   description h1 L3 - VLAN 20
   switchport mode access
   switchport access vlan 20
   spanning-tree portfast
   no shutdown
interface Ethernet4
   description IP uplink to dc1-spine2
   no switchport
   mtu 9000
   ip address 100.64.1.2/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
interface Loopback0
   ip address 10.255.1.1/32
interface Vlan20
   vrf TENANT
   mtu 1500
   ip address virtual 192.168.20.1/24
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vrf TENANT vni 50000
!
ip prefix-list UNDERLAY seq 10 permit 10.255.1.1/32
ip prefix-list UNDERLAY seq 30 permit 10.255.1.254/32
ip prefix-list UNDERLAY seq 50 permit 10.255.1.253/32
ip prefix-list UNDERLAY seq 70 permit 10.255.1.250/32
route-map UNDERLAY permit 10
   match ip address prefix-list UNDERLAY
!
router bgp 65101
   router-id 10.255.1.1
   maximum-paths 2 ecmp 2
   bgp bestpath as-path multipath-relax
   no bgp default ipv4-unicast
   neighbor 100.64.1.1 remote-as 65201
   neighbor 100.64.1.1 bfd
   neighbor 100.64.1.1 description UNDERLAY-DC1-BL
   neighbor 100.64.1.1 route-map UNDERLAY in
   neighbor 100.64.1.1 route-map UNDERLAY out
   neighbor 100.64.1.3 remote-as 65201
   neighbor 100.64.1.3 bfd
   neighbor 100.64.1.3 route-map UNDERLAY in
   neighbor 100.64.1.3 route-map UNDERLAY out
   neighbor 10.255.1.254 remote-as 65201
   neighbor 10.255.1.254 update-source Loopback0
   neighbor 10.255.1.254 ebgp-multihop 8
   neighbor 10.255.1.254 send-community extended
   neighbor 10.255.1.253 remote-as 65201
   neighbor 10.255.1.253 update-source Loopback0
   neighbor 10.255.1.253 ebgp-multihop 8
   neighbor 10.255.1.253 send-community extended
   address-family ipv4
      neighbor 100.64.1.1 activate
      neighbor 100.64.1.3 activate
      network 10.255.1.1/32
   address-family evpn
      neighbor 10.255.1.254 activate
      neighbor 10.255.1.253 activate
   vlan 10
      rd 10.255.1.1:10
      route-target both 65000:10010
      redistribute learned
   vrf TENANT
      rd 10.255.1.1:50000
      route-target import evpn 65000:50000
      route-target export evpn 65000:50000
      redistribute connected
!
end
