! Lab 5: shared Ethernet DCI; MLAG CE, local EVPN VTEP and VRF-lite.
hostname dc1-spine2
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
vrf instance MGMT
vrf instance TENANT
ip routing
ip routing vrf TENANT
spanning-tree mode mstp
no spanning-tree vlan-id 4094
interface Management0
   vrf MGMT
   ip address 172.31.251.15/24
ip route vrf MGMT 0.0.0.0/0 172.31.251.1
vlan 10
   name L2-STRETCH
vlan 901
   name TENANT-L3-TRANSIT
vlan 4094
   name MLAG-PEER
   trunk group MLAG-PEER
interface Loopback0
   ip address 10.255.1.253/32
interface Loopback1
   ip address 10.255.1.250/32
interface Ethernet1
   description Local Arista fabric
   no switchport
   mtu 9000
   ip address 100.64.1.3/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
interface Ethernet2
   description Shared L2 and L3 DWDM member
   channel-group 100 mode active
   lacp timer fast
   no shutdown
interface Port-Channel100
   description MLAG Ethernet handoff to Nokia ES
   switchport mode trunk
   switchport trunk allowed vlan 10,901
   mlag 100
   mtu 9000
   no shutdown
interface Ethernet3
   description MLAG peer-link
   channel-group 10 mode active
   lacp timer fast
   no shutdown
interface Port-Channel10
   switchport mode trunk
   switchport trunk allowed vlan 10,901,4094
   switchport trunk group MLAG-PEER
   mtu 9000
   no shutdown
interface Vlan4094
   ip address 10.254.1.2/30
   no autostate
   mtu 9000
interface Vlan901
   vrf TENANT
   ip address 10.200.0.2/29
   mtu 1500
   bfd interval 500 min-rx 500 multiplier 3
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan vlan 10 vni 10010
   vxlan vrf TENANT vni 50000
mlag configuration
   domain-id DC1-SPINES
   local-interface Vlan4094
   peer-address 10.254.1.1
   peer-link Port-Channel10
   peer-address heartbeat 172.31.251.12 vrf MGMT
   dual-primary detection delay 5 action errdisable all-interfaces
   dual-primary recovery delay mlag 10 non-mlag 0
   reload-delay mlag 10
   reload-delay non-mlag 10
ip prefix-list UNDERLAY seq 10 permit 10.255.1.1/32
ip prefix-list UNDERLAY seq 20 permit 10.255.1.254/32
ip prefix-list UNDERLAY seq 30 permit 10.255.1.253/32
ip prefix-list UNDERLAY seq 40 permit 10.255.1.250/32
ip prefix-list DC1-SERVICE seq 10 permit 192.168.20.0/24
ip prefix-list DC2-SERVICE seq 10 permit 192.168.30.0/24
route-map UNDERLAY permit 10
   match ip address prefix-list UNDERLAY
route-map DC1-SERVICE permit 10
   match ip address prefix-list DC1-SERVICE
route-map DC2-SERVICE permit 10
   match ip address prefix-list DC2-SERVICE
router bgp 65201
   router-id 10.255.1.253
   maximum-paths 2 ecmp 2
   no bgp default ipv4-unicast
   neighbor 100.64.1.2 remote-as 65101
   neighbor 100.64.1.2 bfd
   neighbor 100.64.1.2 route-map UNDERLAY in
   neighbor 100.64.1.2 route-map UNDERLAY out
   neighbor 10.254.1.1 remote-as 65201
   neighbor 10.254.1.1 next-hop-self
   neighbor 10.254.1.1 route-map UNDERLAY in
   neighbor 10.254.1.1 route-map UNDERLAY out
   neighbor 10.255.1.1 remote-as 65101
   neighbor 10.255.1.1 update-source Loopback0
   neighbor 10.255.1.1 ebgp-multihop 8
   neighbor 10.255.1.1 send-community extended
   address-family ipv4
      neighbor 100.64.1.2 activate
      neighbor 10.254.1.1 activate
      network 10.255.1.253/32
      network 10.255.1.250/32
   address-family evpn
      neighbor 10.255.1.1 activate
   vlan 10
      rd 10.255.1.253:10
      route-target both 65000:10010
      redistribute learned
   vrf TENANT
      router-id 10.255.1.253
      rd 10.255.1.253:50000
      route-target import evpn 65000:50000
      route-target export evpn 65000:50000
      neighbor 10.200.0.3 remote-as 65202
      neighbor 10.200.0.3 bfd
      neighbor 10.200.0.3 route-map DC2-SERVICE in
      neighbor 10.200.0.3 route-map DC1-SERVICE out
      neighbor 10.200.0.4 remote-as 65202
      neighbor 10.200.0.4 bfd
      neighbor 10.200.0.4 route-map DC2-SERVICE in
      neighbor 10.200.0.4 route-map DC1-SERVICE out
      address-family ipv4
      neighbor 10.200.0.3 activate
      neighbor 10.200.0.4 activate
end
