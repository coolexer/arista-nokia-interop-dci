! Lab 3: transit-only Arista spine, no tenant VRF/VNI or VXLAN termination.
hostname dc1-spine2
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
vrf instance MGMT
ip routing
interface Management1
   vrf MGMT
   ip address 172.31.249.15/24
ip route vrf MGMT 0.0.0.0/0 172.31.249.1
interface Loopback0
   ip address 10.255.1.253/32
interface Ethernet1
   description Arista leaf routed uplink
   no switchport
   mtu 9000
   ip address 100.64.1.3/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
interface Ethernet2
   description Direct DCI-2 over transparent DWDM to Nokia BL
   no switchport
   mtu 9000
   ip address 100.64.12.2/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
ip prefix-list UNDERLAY seq 10 permit 10.255.1.1/32
ip prefix-list UNDERLAY seq 20 permit 10.255.2.1/32
ip prefix-list UNDERLAY seq 30 permit 10.255.1.254/32
ip prefix-list UNDERLAY seq 40 permit 10.255.1.253/32
ip prefix-list UNDERLAY seq 50 permit 10.255.2.254/32
ip prefix-list UNDERLAY seq 60 permit 10.255.2.253/32
route-map UNDERLAY permit 10
   match ip address prefix-list UNDERLAY
router bgp 65211
   router-id 10.255.1.253
   maximum-paths 2 ecmp 2
   bgp bestpath as-path multipath-relax
   no bgp default ipv4-unicast
   neighbor 100.64.1.2 remote-as 65101
   neighbor 100.64.1.2 bfd
   neighbor 100.64.1.2 route-map UNDERLAY in
   neighbor 100.64.1.2 route-map UNDERLAY out
   neighbor 100.64.12.3 remote-as 65212
   neighbor 100.64.12.3 bfd
   neighbor 100.64.12.3 route-map UNDERLAY in
   neighbor 100.64.12.3 route-map UNDERLAY out
   address-family ipv4
      neighbor 100.64.1.2 activate
      neighbor 100.64.12.3 activate
      network 10.255.1.253/32
end
