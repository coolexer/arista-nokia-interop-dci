! Lab 3: transit-only Arista spine, no tenant VRF/VNI or VXLAN termination.
hostname dc1-spine1
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
vrf instance MGMT
ip routing
interface Management1
   vrf MGMT
   ip address 172.31.249.12/24
ip route vrf MGMT 0.0.0.0/0 172.31.249.1
interface Loopback0
   ip address 10.255.1.254/32
interface Ethernet1
   description Arista leaf routed uplink
   no switchport
   mtu 9000
   ip address 100.64.1.1/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
interface Ethernet2
   description Direct DCI-1 over transparent DWDM to Nokia BL
   no switchport
   mtu 9000
   ip address 100.64.12.0/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
ip prefix-list UNDERLAY seq 10 permit 10.255.1.1/32
ip prefix-list UNDERLAY seq 20 permit 10.255.2.1/32
ip prefix-list UNDERLAY seq 30 permit 10.255.1.254/32
ip prefix-list UNDERLAY seq 40 permit 10.255.1.253/32
ip prefix-list UNDERLAY seq 50 permit 10.255.2.254/32
ip prefix-list UNDERLAY seq 60 permit 10.255.2.253/32
route-map UNDERLAY permit 10
   match ip address prefix-list UNDERLAY
router bgp 65201
   router-id 10.255.1.254
   maximum-paths 2 ecmp 2
   bgp bestpath as-path multipath-relax
   no bgp default ipv4-unicast
   neighbor 100.64.1.0 remote-as 65101
   neighbor 100.64.1.0 bfd
   neighbor 100.64.1.0 route-map UNDERLAY in
   neighbor 100.64.1.0 route-map UNDERLAY out
   neighbor 100.64.12.1 remote-as 65202
   neighbor 100.64.12.1 bfd
   neighbor 100.64.12.1 route-map UNDERLAY in
   neighbor 100.64.12.1 route-map UNDERLAY out
   address-family ipv4
      neighbor 100.64.1.0 activate
      neighbor 100.64.12.1 activate
      network 10.255.1.254/32
end
