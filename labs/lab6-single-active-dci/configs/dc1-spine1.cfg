! Lab 6: shared Ethernet DCI; independent VTEP, native Ethernet DCI and VRF-lite.
hostname dc1-spine1
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
vrf instance MGMT
vrf instance TENANT
ip routing
ip routing vrf TENANT
spanning-tree mode mstp
link tracking group FABRIC
   links minimum 1
interface Management0
   vrf MGMT
   ip address 172.31.252.12/24
ip route vrf MGMT 0.0.0.0/0 172.31.252.1
vlan 10
   name L2-STRETCH
vlan 901
   name TENANT-L3-TRANSIT
interface Loopback0
   ip address 10.255.1.254/32
interface Ethernet1
   description Local Arista fabric
   link tracking group FABRIC upstream
   no switchport
   mtu 9000
   ip address 100.64.1.1/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
interface Ethernet2
   description Single-member LACP trunk to Nokia single-active ES
   channel-group 100 mode active
   lacp timer fast
   link tracking group FABRIC downstream
   no shutdown
interface Port-Channel100
   description Independent LACP handoff; no MLAG
   switchport mode trunk
   switchport trunk allowed vlan 10,901
   spanning-tree portfast
   mtu 9000
   no shutdown
interface Vlan901
   vrf TENANT
   ip address 10.200.0.1/31
   mtu 1500
   bfd interval 500 min-rx 500 multiplier 3
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vrf TENANT vni 50000
ip prefix-list UNDERLAY seq 10 permit 10.255.1.1/32
ip prefix-list UNDERLAY seq 20 permit 10.255.1.254/32
ip prefix-list UNDERLAY seq 30 permit 10.255.1.253/32
ip prefix-list DC1-SERVICE seq 10 permit 192.168.20.0/24
ip prefix-list DC2-SERVICE seq 10 permit 192.168.30.0/24
route-map UNDERLAY permit 10
   match ip address prefix-list UNDERLAY
route-map DC1-SERVICE permit 10
   match ip address prefix-list DC1-SERVICE
route-map DC2-SERVICE permit 10
   match ip address prefix-list DC2-SERVICE
router bgp 65201
   router-id 10.255.1.254
   maximum-paths 2 ecmp 2
   no bgp default ipv4-unicast
   neighbor 100.64.1.0 remote-as 65101
   neighbor 100.64.1.0 bfd
   neighbor 100.64.1.0 route-map UNDERLAY in
   neighbor 100.64.1.0 route-map UNDERLAY out
   neighbor 10.255.1.1 remote-as 65101
   neighbor 10.255.1.1 update-source Loopback0
   neighbor 10.255.1.1 ebgp-multihop 8
   neighbor 10.255.1.1 send-community extended
   neighbor 10.255.1.1 timers 3 9
   address-family ipv4
      neighbor 100.64.1.0 activate
      network 10.255.1.254/32
   address-family evpn
      neighbor 10.255.1.1 activate
   vlan 10
      rd 10.255.1.254:10
      route-target both 65000:10010
      redistribute learned
   vrf TENANT
      router-id 10.255.1.254
      rd 10.255.1.254:50000
      route-target import evpn 65000:50000
      route-target export evpn 65000:50000
      neighbor 10.200.0.0 remote-as 65202
      neighbor 10.200.0.0 bfd
      neighbor 10.200.0.0 timers 3 9
      neighbor 10.200.0.0 route-map DC2-SERVICE in
      neighbor 10.200.0.0 route-map DC1-SERVICE out
      address-family ipv4
         neighbor 10.200.0.0 activate
end
