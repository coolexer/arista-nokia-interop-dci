! Lab 4: Arista VXLAN-to-VXLAN L3 EVPN gateway, RT-5 next-hop-self.
hostname dc1-spine1
service routing protocols model multi-agent
username admin privilege 15 role network-admin secret admin
vrf instance MGMT
vrf instance TENANT
ip routing
ip routing vrf TENANT
ip virtual-router mac-address 00:00:5e:00:01:01
interface Management1
   vrf MGMT
   ip address 172.31.250.12/24
ip route vrf MGMT 0.0.0.0/0 172.31.250.1
interface Loopback0
   ip address 10.255.1.254/32
interface Ethernet1
   description Arista leaf routed uplink
   no switchport
   mtu 9000
   ip address 100.64.1.1/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
interface Ethernet2
   description Direct DCI-1 over transparent DWDM to Nokia BL
   no switchport
   mtu 9000
   ip address 100.64.12.0/31
   bfd interval 500 min-rx 500 multiplier 3
   no shutdown
ip prefix-list UNDERLAY seq 10 permit 10.255.1.1/32
ip prefix-list UNDERLAY seq 20 permit 10.255.2.1/32
ip prefix-list UNDERLAY seq 30 permit 10.255.1.254/32
ip prefix-list UNDERLAY seq 40 permit 10.255.1.253/32
ip prefix-list UNDERLAY seq 50 permit 10.255.2.254/32
ip prefix-list UNDERLAY seq 60 permit 10.255.2.253/32
ip prefix-list DCI seq 10 permit 10.255.1.254/32
ip prefix-list DCI seq 20 permit 10.255.1.253/32
ip prefix-list DCI seq 30 permit 10.255.2.254/32
ip prefix-list DCI seq 40 permit 10.255.2.253/32
ip prefix-list DCI seq 50 permit 10.255.2.1/32
route-map DCI permit 10
   match ip address prefix-list DCI
route-map EVPN-L3 permit 10
   match evpn route-type ip-prefix
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vrf TENANT vni 50000
route-map UNDERLAY permit 10
   match ip address prefix-list UNDERLAY
router bgp 65201
   router-id 10.255.1.254
   maximum-paths 2 ecmp 2
   bgp bestpath as-path multipath-relax
   no bgp default ipv4-unicast
   neighbor 100.64.1.0 remote-as 65101
   neighbor 100.64.1.0 bfd
   neighbor 100.64.1.0 route-map UNDERLAY in
   neighbor 100.64.1.0 route-map UNDERLAY out
   neighbor 100.64.12.1 remote-as 65202
   neighbor 100.64.12.1 bfd
   neighbor 100.64.12.1 route-map DCI in
   neighbor 100.64.12.1 route-map DCI out
   neighbor 10.255.1.1 remote-as 65101
   neighbor 10.255.1.1 update-source Loopback0
   neighbor 10.255.1.1 ebgp-multihop 8
   neighbor 10.255.1.1 send-community extended
   neighbor 10.255.2.1 remote-as 65102
   neighbor 10.255.2.1 update-source Loopback0
   neighbor 10.255.2.1 ebgp-multihop 8
   neighbor 10.255.2.1 send-community extended
   address-family ipv4
      neighbor 100.64.1.0 activate
      neighbor 100.64.12.1 activate
      network 10.255.1.254/32
   address-family evpn
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix
      neighbor 10.255.1.1 activate
      neighbor 10.255.1.1 encapsulation vxlan
      neighbor 10.255.1.1 route-map EVPN-L3 in
      neighbor 10.255.1.1 route-map EVPN-L3 out
      neighbor 10.255.2.1 activate
      neighbor 10.255.2.1 encapsulation vxlan
      neighbor 10.255.2.1 route-map EVPN-L3 in
      neighbor 10.255.2.1 route-map EVPN-L3 out
   vrf TENANT
      rd 10.255.1.254:50000
      router-id 10.255.1.254
      route-target import evpn 65000:50000
      route-target export evpn 65000:50000
end
